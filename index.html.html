/* ---------- Supabase: sessão e requisições ---------- */
function setSes(j){
  const u=j.user||(SES&&SES.user)||{};
  SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(+j.expires_in||3600),user:{id:u.id,email:String(u.email||"").toLowerCase()}};
  store.set(SES_KEY,JSON.stringify(SES));
}
let REF=null;
function refreshSes(){
  if(!SES)return Promise.reject({auth:true});
  if(REF)return REF;
  REF=(async()=>{
    const r=await tfetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SES.refresh_token})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token){if(r.status>=400&&r.status<500)throw{auth:true};throw{msg:"Servidor indisponível."}}
    setSes(j);return j.access_token;
  })();
  const clear=()=>{REF=null};REF.then(clear,clear);
  return REF;
}
async function token(){
  if(!SES)throw{auth:true};
  if(SES.expires_at-60>Date.now()/1000)return SES.access_token;
  return refreshSes();
}
async function tfetch(url,opt,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);
  try{return await fetch(url,Object.assign({signal:c.signal},opt))}finally{clearTimeout(t)}
}
async function rest(path,opt){
  opt=opt||{};
  const go=tk=>tfetch(SB_URL+"/rest/v1/"+path,{method:opt.method||"GET",keepalive:!!opt.keepalive,body:opt.body,headers:Object.assign({apikey:SB_KEY,Authorization:"Bearer "+tk,"Content-Type":"application/json"},opt.headers||{})});
  let r;
  try{r=await go(await token())}
  catch(e){if(e&&e.auth)throw e;await new Promise(x=>setTimeout(x,1200));r=await go(await token())}
  if(r.status===401)r=await go(await refreshSes());
  return r;
}
const isTableErr=(r,j)=>r.status===404||(j&&(j.code==="PGRST205"||j.code==="42P01"));
async function pull(uid){
  const r=await rest("wilfit_data?select=data&user_id=eq."+encodeURIComponent(uid));
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e={msg:(j&&j.message)||"Erro "+r.status};if(isTableErr(r,j))e.table=true;throw e}
  return Array.isArray(j)&&j[0]?j[0]:null;
}

/* ---------- Fotos dos exercícios (Supabase Storage, bucket público "fotos") ---------- */
const BUCKET="fotos",PH_KEY="wilfit_photos_v1";
const normKey=s=>norm(s).replace(/\.[a-z0-9]{2,5}$/,"").replace(/[^a-z0-9]+/g,"");
let PH={},PH_N=0;
try{const c=JSON.parse(store.get(PH_KEY)||"null");if(c&&c.m){PH=c.m;PH_N=Object.keys(PH).length}}catch(e){}
const pubUrl=p=>SB_URL+"/storage/v1/object/public/"+BUCKET+"/"+p.split("/").map(encodeURIComponent).join("/");
function photoKnown(x){return PH[normKey(x.id)]||PH[normKey(x.n)]||""}
function photoUrls(x){
  const k=photoKnown(x);if(k)return [pubUrl(k)];
  if(PH_N>0)return [];
  /* lista indisponível: tenta nomes prováveis */
  const ex=["jpg","jpeg","png","webp"],base=[x.id,x.n,norm(x.n).replace(/\s+/g,"_")],out=[];
  base.forEach(b=>ex.forEach(e=>{const u=pubUrl(b+"."+e);if(out.indexOf(u)<0)out.push(u)}));
  return out;
}
function imgErr(el){
  let c=[];try{c=JSON.parse(el.dataset.c)}catch(e){}
  const i=(+el.dataset.i||0)+1;
  if(i<c.length){el.dataset.i=i;el.src=c[i]}
  else{el.style.display="none";const a=document.getElementById("fanim");if(a)a.style.display="block"}
}
async function listDir(prefix){
  const h={apikey:SB_KEY,"Content-Type":"application/json"};
  if(SES&&SES.access_token)h.Authorization="Bearer "+SES.access_token;
  const r=await tfetch(SB_URL+"/storage/v1/object/list/"+BUCKET,{method:"POST",headers:h,body:JSON.stringify({prefix:prefix,limit:1000,offset:0,sortBy:{column:"name",order:"asc"}})},15000);
  if(!r.ok)throw new Error("list "+r.status);
  return r.json();
}
async function loadPhotos(){
  try{
    const m={};
    const walk=async(prefix,depth)=>{
      const L=await listDir(prefix);
      for(const o of L){
        if(!o||!o.name)continue;
        const path=prefix?prefix+"/"+o.name:o.name;
        if(!o.id&&depth<2){await walk(path,depth+1);continue}
        if(/\.(jpe?g|png|webp|gif|avif)$/i.test(o.name)){const k=normKey(o.name);if(!m[k])m[k]=path}
      }
    };
    await walk("",0);
    const mudou=JSON.stringify(m)!==JSON.stringify(PH);
    PH=m;PH_N=Object.keys(m).length;
    store.set(PH_KEY,JSON.stringify({m:m,t:Date.now()}));
    const ae=document.activeElement;
    if(mudou&&S.me&&(S.det||S.tab==="lib")&&!(ae&&/INPUT|SELECT/.test(ae.tagName)))R();
  }catch(e){}
}

/* ---------- Status da conexão (internet + Supabase) ---------- */
const NET={st:"chk",msg:"Verificando conexão…"};
function netHtml(){
  const ico=NET.st==="ok"?"Conectado":NET.st==="chk"?"Verificando":NET.st==="tbl"?"Falta configurar":NET.st==="off"?"Sem internet":"Supabase indisponível";
  return `<div class="net ${NET.st}" role="status"><i class="dot"></i><span><b>${ico}</b> · ${esc(NET.msg)}</span><button data-a="net">Testar</button></div>`;
}
const netBar=()=>`<div id="net">${netHtml()}</div>`;
function paintNet(){const e=document.getElementById("net");if(e)e.innerHTML=netHtml()}
function setNet(st,msg){NET.st=st;NET.msg=msg;paintNet()}
let checking=false;
async function checkNet(){
  if(checking)return;checking=true;
  setNet("chk","Verificando…");
  try{
    if(!navigator.onLine){setNet("off","Sem internet. Seus dados ficam salvos no aparelho e sobem quando a conexão voltar.");return}
    /* 1) alcance de rede: qualquer resposta (mesmo opaca) prova que o servidor está acessível */
    try{await tfetch(SB_URL+"/auth/v1/health",{mode:"no-cors"},8000)}
    catch(e){setNet(navigator.onLine?"srv":"off",navigator.onLine?"Não foi possível alcançar o Supabase. Abra o app direto no navegador (não pelo visualizador de arquivos/chat) ou verifique se o projeto está pausado.":"Sem internet. Seus dados ficam salvos no aparelho.");return}
    /* 2) chave: se a antiga for recusada, tenta a chave publishable */
    let r=await tfetch(SB_URL+"/auth/v1/health",{headers:{apikey:SB_KEY}},8000);
    if(r.status===401||r.status===403){SB_KEY=SB_PUB;r=await tfetch(SB_URL+"/auth/v1/health",{headers:{apikey:SB_KEY}},8000)}
    if(r.status===401||r.status===403){setNet("srv","Supabase alcançado, mas a chave de acesso foi recusada. Confira a chave anon/publishable no painel.");return}
    if(r.status>=500){setNet("srv","Supabase fora do ar (projeto pausado?). Abra o painel do Supabase e clique em Restore.");return}
    if(S.me&&SES){
      const t=await rest("wilfit_data?select=user_id&limit=1");
      if(t.ok){setNet("ok","Internet e Supabase funcionando. Dados na nuvem.");schedule();return}
      const j=await t.json().catch(()=>null);
      if(isTableErr(t,j)){setNet("tbl","Supabase alcançado, mas a tabela não existe. Rode o supabase_setup.sql no SQL Editor.");return}
      setNet("srv","Supabase respondeu com erro: "+((j&&j.message)||t.status));return
    }
    setNet("ok","Internet e Supabase funcionando.");
  }catch(e){
    setNet(navigator.onLine?"srv":"off",navigator.onLine?"Resposta lenta ou instável do Supabase. Toque em Testar para tentar de novo.":"Sem internet. Seus dados ficam salvos no aparelho.");
  }finally{checking=false}
}

/* ---------- Sincronização ---------- */
const SYNC_TXT={ok:"☁ Sincronizado",pend:"☁ Salvando…",err:"⚠ Falha ao sincronizar",off:"☁ Offline"};
let LASTSYNC=0;
function paintSync(){const e=document.getElementById("sync");if(!e)return;
  if(S.sync==="ok"&&LASTSYNC){const d=new Date(LASTSYNC);e.textContent="☁ Sincronizado "+pad(d.getHours())+":"+pad(d.getMinutes())}
  else e.textContent=SYNC_TXT[S.sync]||""}
function setSync(s){S.sync=s;if(s==="ok")LASTSYNC=Date.now();paintSync()}
let pushing=false,timer=null,LAST="",WARNED=false;
function schedule(){
  if(!S.me||!SES||!DB[S.me]||S.pend)return;
  if(JSON.stringify(DB[S.me])===LAST)return;
  DIRTY[S.me]=true;saveDirty();setSync("pend");
  clearTimeout(timer);timer=setTimeout(()=>push(),900);
}
async function push(ka){
  clearTimeout(timer);timer=null;
  if(!S.me||!SES||pushing||S.pend)return;
  const em=S.me,uid=SES.user.id,snap=JSON.stringify(DB[em]);
  if(snap===LAST&&!DIRTY[em]){setSync("ok");return}
  pushing=true;
  try{
    const r=await rest("wilfit_data?on_conflict=user_id",{method:"POST",keepalive:!!ka,headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:uid,email:em,data:JSON.parse(snap),updated_at:new Date().toISOString()})});
    if(!r.ok){const j=await r.json().catch(()=>null);throw{msg:(j&&j.message)||"Erro "+r.status,table:isTableErr(r,j),perm:!!(j&&j.code==="42501")}}
    LAST=snap;
    if(NET.st!=="ok")setNet("ok","Internet e Supabase funcionando. Dados na nuvem.");
    if(S.me===em){
      if(JSON.stringify(DB[em])===snap){delete DIRTY[em];saveDirty();setSync("ok")}
      else{pushing=false;schedule()}
    }
  }catch(e){
    if(e&&e.auth){forceLogout("Sessão expirada. Entre novamente.")}
    else{
      setSync(navigator.onLine?"err":"off");
      if(e&&e.table)setNet("tbl","Tabela não existe no Supabase. Rode o supabase_setup.sql no SQL Editor.");
      else if(!navigator.onLine||(e&&e.name==="AbortError")||(e instanceof TypeError))checkNet();
      if(e&&(e.table||e.perm)&&!WARNED){WARNED=true;toast(e.table?"Tabela não encontrada no Supabase. Rode o supabase_setup.sql.":"Sem permissão no Supabase. Rode o supabase_setup.sql (políticas RLS).")}
    }
  }finally{pushing=false}
}
const AP_KEY="wilfit_ap_v1";
function apGet(em){try{return !!(JSON.parse(store.get(AP_KEY)||"{}")[em])}catch(e){return false}}
function apSet(em,v){try{const o=JSON.parse(store.get(AP_KEY)||"{}");o[em]=!!v;store.set(AP_KEY,JSON.stringify(o))}catch(e){}}
async function approvedState(uid){
  const r=await rest("wilfit_users?select=approved&user_id=eq."+encodeURIComponent(uid));
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e={msg:(j&&j.message)||"Erro "+r.status};if(isTableErr(r,j))e.table=true;throw e}
  return !!(Array.isArray(j)&&j[0]&&j[0].approved);
}
async function boot(){
  if(!S.me||!SES||pushing)return;
  const em=S.me;
  try{
    /* 1) aprovação do administrador (checada a cada sincronização) */
    const ap=await approvedState(SES.user.id);
    if(S.me!==em)return;
    apSet(em,ap);
    if(!ap){if(!S.pend){S.pend=true;R()}else paintNet();setSync("ok");return}
    if(S.pend){S.pend=false;await enter(em);R();return}
    /* 2) sincronização dos dados */
    if(DIRTY[em]){await push();return}
    const row=await pull(SES.user.id);
    if(S.me!==em)return;
    if(row&&row.data){
      const nd=fixUser(row.data),a=JSON.stringify(nd);
      LAST=a;
      if(DIRTY[em])return;
      if(a!==JSON.stringify(DB[em])){
        DB[em]=nd;saveLocal();
        const ae=document.activeElement;
        if(!(ae&&/INPUT|SELECT/.test(ae.tagName)))R();
      }
      setSync("ok");
    }else{LAST="";DIRTY[em]=true;saveDirty();await push()}
  }catch(e){
    if(e&&e.auth)forceLogout("Sessão expirada. Entre novamente.");
    else{setSync(navigator.onLine?"err":"off");if(e&&e.table&&!WARNED){WARNED=true;toast("Tabela não encontrada no Supabase. Rode o supabase_setup.sql.")}}
  }
}
function forceLogout(m){SES=null;store.set(SES_KEY,"");S.me=null;S.det=null;S.pend=false;S.adm=null;S.err=m||"";S.ok="";stopRest();R()}
async function doLogout(){
  const em=S.me;
  if(em&&SES&&DIRTY[em]){setSync("pend");await Promise.race([push(),new Promise(r=>setTimeout(r,4000))])}
  SES=null;store.set(SES_KEY,"");S.me=null;S.det=null;S.pend=false;S.adm=null;S.form.pw="";S.tab="home";S.err="";S.ok="";LAST="";stopRest();R();
}

/* ---------- Cronômetro de descanso (só roda enquanto há descanso ativo) ---------- */
let REST=null,RT=null;
function startRest(seg){
  REST={end:Date.now()+seg*1000};
  if(!RT)RT=setInterval(paintRest,250);
  paintRest();
}
function stopRest(){REST=null;if(RT){clearInterval(RT);RT=null}paintRest()}
function paintRest(){
  const box=document.getElementById("rest");
  if(REST&&S.me){
    const left=Math.ceil((REST.end-Date.now())/1000);
    if(left<=0){stopRest();toast("Descanso concluído ✓");return}
    if(box){
      const html=`<div class="rest"><span>Descanso</span><b>${pad(Math.floor(left/60))}:${pad(left%60)}</b><button class="btn" data-a="pular">Pular</button></div>`;
      if(box.dataset.h!==html){box.dataset.h=html;box.innerHTML=html}
    }
  }else{
    if(RT){clearInterval(RT);RT=null}
    if(box&&box.dataset.h){box.dataset.h="";box.innerHTML=""}
  }
}

/* ---------- Modo administrador ---------- */
async function rpc(name,args){
  const h={apikey:SB_KEY,"Content-Type":"application/json"};
  let tk=null;try{if(SES)tk=await token()}catch(e){}
  if(tk)h.Authorization="Bearer "+tk;else if(SB_KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+SB_KEY;
  const r=await tfetch(SB_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:h,body:JSON.stringify(args)},15000);
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e={msg:(j&&j.message)||"Erro "+r.status};if(r.status===404||(j&&(j.code==="PGRST202"||j.code==="42883")))e.fn=true;throw e}
  return j||{};
}
async function admLoad(){
  const A=S.adm;if(!A||A.busy)return;
  A.busy=true;R();
  try{
    const j=await rpc("wilfit_admin_list",{pw:A.pw});
    if(!S.adm)return;
    if(j.erro){A.err=j.erro==="bloqueado"?"Muitas tentativas erradas. Aguarde 10 minutos.":"Senha incorreta.";A.step="pw";A.pw=""}
    else{A.users=j.users||[];A.step="list";A.err=""}
  }catch(e){A.err=e&&e.fn?"Função do admin não encontrada. Rode o supabase_setup.sql atualizado.":((e&&e.msg)||"Sem conexão com o Supabase.")}
  A.busy=false;R();
}
async function admSet(uid,ok){
  const A=S.adm;if(!A||A.busy)return;
  A.busy=true;R();
  try{
    const j=await rpc("wilfit_admin_set",{pw:A.pw,uid:uid,ok:ok});
    if(j.erro){A.err="Sessão de admin inválida. Entre de novo.";A.step="pw";A.pw=""}
    else toast(ok?"Usuário aprovado ✓":"Usuário bloqueado");
  }catch(e){A.err=(e&&e.msg)||"Sem conexão com o Supabase."}
  A.busy=false;
  if(A.step==="list")admLoad();else R();
}

/* ---------- Autenticação (Supabase Auth) ---------- */
function amsg(j){
  const m=String(j.msg||j.message||j.error_description||j.error||""),c=j.error_code||"";
  if(c==="invalid_credentials"||/invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(c==="email_not_confirmed"||/not confirmed/i.test(m))return"Confirme seu e-mail pelo link que enviamos e tente de novo.";
  if(c==="user_already_exists"||/already registered/i.test(m))return"Este e-mail já tem conta. Use Entrar.";
  if(c==="weak_password"||/at least \d+ char/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(c==="over_email_send_rate_limit"||/email rate limit/i.test(m))return"Limite de e-mails do Supabase atingido. Rode o supabase_setup.sql atualizado (libera contas sem e-mail) e tente Entrar.";
  if(c==="over_request_rate_limit"||/rate limit/i.test(m)||j.code===429)return"Muitas tentativas. Aguarde um pouco e tente de novo.";
  if(c==="signup_disabled")return"Novos cadastros estão desativados neste projeto.";
  if(c==="email_address_invalid"||/invalid.*email/i.test(m))return"E-mail inválido.";
  return m||"Erro ao autenticar.";
}
async function enter(em){
  const local=DB[em],uid=SES.user.id;
  let data,needPush=false,ap;
  try{ap=await approvedState(uid)}
  catch(e){
    if(e&&e.table)throw{msg:"O banco ainda não está configurado. Rode o supabase_setup.sql atualizado no SQL Editor do Supabase."};
    if(e&&e.auth)throw e;
    ap=apGet(em);
  }
  apSet(em,ap);
  if(!ap){
    DB[em]=fixUser(local);S.me=em;S.pend=true;S.tab="home";S.form.pw="";S.err="";S.ok="";saveLocal();setSync("ok");return;
  }
  S.pend=false;
  try{
    const row=await pull(uid);
    if(row&&row.data&&!(DIRTY[em]&&local)){data=fixUser(row.data);LAST=JSON.stringify(data)}
    else if(local){data=fixUser(local);needPush=true}
    else{data=mkUser();needPush=true}
  }catch(e){
    if(e&&e.table)throw{msg:"As tabelas ainda não existem no Supabase. Rode o arquivo supabase_setup.sql no SQL Editor."};
    if(e&&e.auth)throw e;
    if(local){data=fixUser(local);needPush=true}
    else throw{msg:"Não foi possível carregar seus dados. Verifique a conexão e tente de novo."};
  }
  DB[em]=data;S.me=em;S.tab="home";S.dia=td();S.form.pw="";S.err="";S.ok="";
  pruneProg();saveLocal();setSync("ok");loadPhotos();
  if(needPush){LAST="";DIRTY[em]=true;saveDirty();push()}
}
async function auth(){
  if(S.busy)return;
  const em=S.form.em.trim().toLowerCase(),pw=S.form.pw;
  S.ok="";
  if(!/^\S+@\S+\.\S+$/.test(em)){S.err="Digite um e-mail válido";R();return}
  if(S.aba==="cad"&&pw.length<6){S.err="A senha precisa ter pelo menos 6 caracteres.";R();return}
  if(!pw){S.err="Digite sua senha.";R();return}
  S.busy=true;S.err="";R();
  try{
    const hd={apikey:SB_KEY,"Content-Type":"application/json"};
    let r,j;
    if(S.aba==="cad"){
      r=await tfetch(SB_URL+"/auth/v1/signup",{method:"POST",headers:hd,body:JSON.stringify({email:em,password:pw})});
      j=await r.json().catch(()=>({}));
      if(!r.ok){S.err=amsg(j);return}
      if(!j.access_token){
        /* Conta já criada no Supabase Auth. Tenta entrar direto (funciona se a confirmação de e-mail estiver desligada) */
        const r2=await tfetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:hd,body:JSON.stringify({email:em,password:pw})});
        const j2=await r2.json().catch(()=>({}));
        if(r2.ok&&j2.access_token)j=j2;
        else{S.aba="entrar";S.form.pw="";S.ok="Conta criada no Supabase! Se o e-mail de confirmação não chegar, rode o supabase_setup.sql atualizado no SQL Editor (ele confirma as contas) e toque em Entrar.";return}
      }
    }else{
      r=await tfetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:hd,body:JSON.stringify({email:em,password:pw})});
      j=await r.json().catch(()=>({}));
      if(!r.ok||!j.access_token){S.err=amsg(j);return}
    }
    setSes(j);
    await enter(SES.user.email||em);
  }catch(e){
    if(!S.me){SES=null;store.set(SES_KEY,"")}
    S.err=(e&&e.msg)||"Sem conexão. Verifique sua internet.";
  }finally{S.busy=false;R()}
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");
  if(!el)return;
  if(el.classList.contains("ov")&&e.target!==el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(S.me&&!DB[S.me]){S.me=null}
  switch(a){
    case"aba":S.aba=v;S.err="";S.ok="";break;
    case"auth":auth();return;
    case"net":checkNet();return;
    case"chkap":boot();return;
    case"adm":S.adm={step:"pw",pw:"",users:[],err:"",busy:false};break;
    case"admclose":S.adm=null;break;
    case"admgo":admLoad();return;
    case"admref":admLoad();return;
    case"admset":admSet(el.dataset.v,el.dataset.ok==="1");return;
    case"sair":doLogout();return;
    case"tab":S.tab=v;S.det=null;S.clr=false;if(v==="lib"){S.q="";S.g="Todos"}window.scrollTo(0,0);break;
    case"dia":S.dia=+v;S.clr=false;break;
    case"criar":{const p=ensure(S.dia);if(S.nome.trim())p.n=S.nome.trim();S.nome="";break}
    case"up":case"dn":{const L=plan(S.dia).ex,i=+v,j=a==="up"?i-1:i+1;if(L[j])[L[i],L[j]]=[L[j],L[i]];break}
    case"rm":{const L=plan(S.dia).ex,x=L[+v];if(x)clearProg(S.dia,x.id);L.splice(+v,1);break}
    case"ser":{
      const arr=serArr(el.dataset.d,el.dataset.id),n=+el.dataset.n;
      arr[n]=!arr[n];
      if(arr[n]){
        const px=plan(+el.dataset.d),ex=px&&px.ex.find(x=>x.id===el.dataset.id);
        const seg=ex?(+ex.d||0):0;
        if(seg>0)startRest(seg);
      }
      break}
    case"clr":if(S.clr){clearProg(S.dia);delete U().plan[S.dia];S.clr=false}else S.clr=true;break;
    case"gp":S.g=v;break;
    case"det":S.det=v;S.detDia=S.dia;break;
    case"fechar":S.det=null;break;
    case"ddia":S.detDia=+v;break;
    case"salvar":{const p=ensure(S.detDia);if(p.ex.some(x=>x.id===S.det)){toast("Já está em "+DN[S.detDia])}else{p.ex.push({id:S.det,s:3,r:"10-12",d:60});toast("Salvo em "+DN[S.detDia]+" ✓")}S.det=null;break}
    case"crg":{const f=S.cf;if(!(+f.min>0)){toast("Informe o tempo em minutos");return}U().cardio.push({t:f.t,min:+f.min,km:+f.km||0,obs:f.obs,date:isoLocal(new Date())});S.cf={t:f.t,min:"",km:"",obs:""};toast("Cardio registrado");break}
    case"cdel":U().cardio.splice(+v,1);break;
    case"pular":stopRest();break;
  }
  save();R();
});

function onField(e){
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;const k=t.dataset.k;
  if(f==="admpw"){if(S.adm)S.adm.pw=t.value;return}
  if(f==="em")S.form.em=t.value;
  else if(f==="pw")S.form.pw=t.value;
  else if(f==="nome")S.nome=t.value;
  else if(f==="q"){S.q=t.value;const l=$("#lista");if(l)l.innerHTML=listaBib();return}
  else if(f==="pn"){const p=plan(S.dia);if(p){p.n=t.value;save()}return}
  else if(f==="pf"){U().prof[k]=t.value;save();return}
  else if(f==="ex"){
    const p=plan(S.dia),x=p&&p.ex[+t.dataset.i];
    if(x){
      if(k==="r")x[k]=t.value;
      else{const n=Math.floor(+t.value);x[k]=Math.min(k==="s"?20:3600,Math.max(k==="s"?1:0,isNaN(n)?(k==="s"?1:0):n))}
      save();
      if(e.type==="change"&&k!=="r")R();
    }
    return}
  else if(f==="cf"){S.cf[k]=t.value;return}
}
